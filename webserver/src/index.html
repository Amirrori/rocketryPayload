<!DOCTYPE html>
<html>
    <head>
        <title>UHRocketry Payload Dashboard</title>
        <link rel="stylesheet" href="reset.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="content-wrapper">
            <header>
                <div class="fit-content">
                    <img class="mb-sm" src="public/uhrk_logo.webp" alt="UH Rocketry logo">
                    <h1 class="text-center">Payload Dashboard</h1>
                </div>
            </header>

            <div id="telemetry-wrapper" class="flex-wrap">
                <section id="camera-feed-1" class="data-card camera-feed">
                    <span class="warning">NO DATA</span>
                    <h2>Camera Feed 1</h2>
                    <div class="img-wrapper">
                        <img src="assets/rocket-camera.webp">
                    </div>
                </section>
            </div>
        </div>

        <template id="telemetry-wrapper-generic">
            <section class="data-card data-only">
                <span class="warning">NO DATA</span>
                <h2></h2>
                <div class="sensor-data"></div>
            </section>
        </template>

        <template id="data-point-generic">
            <div class="data-point">
                <h3></h3><span class="gray units"></span>
                <span class="value"></span>
            </div>
        </template>

        <script src="gauge.js"></script>
        <script src="script.js"></script>
        <script src="update.js"></script>
    </body>
</html>
